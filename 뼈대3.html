<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쓸기자판 뼈대 레이아웃 최종수정</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .keyboard-container {
            display: grid;
            /* 1~3열은 일반 자판 크기, 4열(우측 작은판들)은 조금 더 좁게 조절 */
            grid-template-columns: 1fr 1fr 1fr 0.8fr;
            grid-template-rows: repeat(4, 58px);
            gap: 4px;
            background-color: #000;
            padding: 6px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
        }
        .key {
            background-color: #383838;
            border: none;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            color: #e0e0e0;
            position: relative;
        }
        /* 왼쪽 3열 본체 키 스타일 */
        .key.red { color: #ff4444; font-weight: bold; font-size: 20px; }
        .key.yellow { color: #ffeb3b; font-weight: bold; font-size: 20px; }
        .key.green { color: #4caf50; font-weight: bold; font-size: 20px; }
        .key.black-box { border: 2px solid #000; background-color: #333; }

        /* 우측 4개의 독립된 작은 판 스타일 (세로로 완벽히 4개로 쪼개짐) */
        .key.right-1 {
            grid-column: 4;
            grid-row: 1;
            background-color: #2b2b2b;
            font-size: 20px;
        }
        .key.right-2 {
            grid-column: 4;
            grid-row: 2;
            background-color: #2b2b2b;
            font-size: 20px;
        }
        .key.right-3 {
            grid-column: 4;
            grid-row: 3;
            background-color: #2b2b2b;
            font-size: 11px;
            line-height: 1.1;
            text-align: center;
        }
        .key.right-4 {
            grid-column: 4;
            grid-row: 4;
            background-color: #2b2b2b;
            font-size: 20px;
        }

        /* 우측 상단 작은 숫자 표시 */
        .mini-num {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 9px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="keyboard-container">
        <!-- 1행 -->
        <div class="key red">O<span class="mini-num">1</span></div>
        <div class="key">ㄱ<span class="mini-num">2</span></div>
        <div class="key">┃<span class="mini-num">3</span></div>
        <div class="key right-1">⌫</div>

        <!-- 2행 -->
        <div class="key yellow">ㄴ<span class="mini-num">4</span></div>
        <div class="key">ㄷ<span class="mini-num">5</span></div>
        <div class="key">⸩<span class="mini-num">6</span></div>
        <div class="key right-2">⚙</div>

        <!-- 3행 -->
        <div class="key green">ㅅ<span class="mini-num">7</span></div>
        <div class="key">ㅈ<span class="mini-num">8</span></div>
        <div class="key">ㅡ<span class="mini-num">9</span></div>
        <div class="key right-3">~^'<br>,.?<br>/!A</div>

        <!-- 4행 -->
        <div class="key black-box">□<span class="mini-num">*</span></div>
        <div class="key">ㅂ<span class="mini-num">0</span></div>
        <div class="key">📋<span class="mini-num">#</span></div>
        <div class="key right-4">↵</div>
    </div>

</body>
</html>
