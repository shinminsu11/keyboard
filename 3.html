<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쓸기자판 영문판 미리보기</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .keyboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 58px);
            gap: 4px;
            background-color: #000;
            padding: 6px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
        }
        .key {
            background-color: #383838;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #e0e0e0;
        }
        .key.eng {
            color: #569cd6;
        }
        .key.special {
            background-color: #2b2b2b;
            font-size: 16px;
            font-weight: normal;
        }
    </style>
</head>
<body>

    <div class="keyboard-grid">
        <!-- 표준 영문판 1행 -->
        <div class="key eng">Q</div>
        <div class="key eng">W</div>
        <div class="key eng">E</div>
        <div class="key special">⌫</div>

        <!-- 표준 영문판 2행 -->
        <div class="key eng">R</div>
        <div class="key eng">T</div>
        <div class="key eng">Y</div>
        <div class="key special">⚙</div>

        <!-- 표준 영문판 3행 -->
        <div class="key eng">U</div>
        <div class="key eng">I</div>
        <div class="key eng">O</div>
        <div class="key eng">P</div>

        <!-- 표준 영문판 4행 -->
        <div class="key eng">A</div>
        <div class="key eng">S</div>
        <div class="key eng">D</div>
        <div class="key special" style="background-color: #222;">↵</div>
    </div>

</body>
</html>
