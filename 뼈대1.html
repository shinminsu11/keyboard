<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쓸기자판 뼈대 레이아웃</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .keyboard-frame {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            background-color: #000;
            padding: 6px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
        }
        .key {
            background-color: #333;
            border: none;
            border-radius: 6px;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #ddd;
        }
        .key.red { color: #ff4444; }
        .key.yellow { color: #ffeb3b; }
        .key.green { color: #4caf50; }
        .key.enter { background-color: #222; }
    </style>
</head>
<body>

    <div class="keyboard-frame">
        <!-- 1행 -->
        <div class="key red">O</div>
        <div class="key">ㄱ</div>
        <div class="key">ㅣ</div>
        <div class="key">⌫</div>

        <!-- 2행 -->
        <div class="key yellow">ㄴ</div>
        <div class="key">ㄷ</div>
        <div class="key">❖</div>
        <div class="key">⚙</div>

        <!-- 3행 -->
        <div class="key green">ㅅ</div>
        <div class="key">ㅈ</div>
        <div class="key">ㅡ</div>
        <div class="key">, A</div>

        <!-- 4행 -->
        <div class="key">ㅁ</div>
        <div class="key">ㅂ</div>
        <div class="key">📋</div>
        <div class="key enter">↵</div>
    </div>

</body>
</html>
