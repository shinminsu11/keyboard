<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진짜 표준 영문 쿼티 자판</title>
    <style>
        body {
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .standard-keyboard {
            background-color: #cfd8dc;
            padding: 8px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-width: 420px;
        }
        .row {
            display: flex;
            justify-content: center;
            gap: 5px;
        }
        .key {
            background-color: #ffffff;
            border: none;
            border-radius: 6px;
            flex: 1;
            height: 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: 500;
            color: #263238;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            position: relative;
        }
        .key.special {
            background-color: #b0bec5;
            flex: 1.2;
        }
        .key.space {
            flex: 4;
            background-color: #ffffff;
            font-size: 14px;
            color: #546e7a;
        }
        .sub-text {
            font-size: 9px;
            color: #78909c;
            position: absolute;
            top: 3px;
            left: 5px;
        }
    </style>
</head>
<body>

    <div class="standard-keyboard">
        <!-- 숫자 줄 -->
        <div class="row">
            <div class="key" style="flex:1;">1</div>
            <div class="key" style="flex:1;">2</div>
            <div class="key" style="flex:1;">3</div>
            <div class="key" style="flex:1;">4</div>
            <div class="key" style="flex:1;">5</div>
            <div class="key" style="flex:1;">6</div>
            <div class="key" style="flex:1;">7</div>
            <div class="key" style="flex:1;">8</div>
            <div class="key" style="flex:1;">9</div>
            <div class="key" style="flex:1;">0</div>
        </div>

        <!-- 1번째 문자 줄: q w e r t y u i o p -->
        <div class="row">
            <div class="key"><span class="sub-text">%</span>q</div>
            <div class="key"><span class="sub-text">₩</span>w</div>
            <div class="key"><span class="sub-text">=</span>e</div>
            <div class="key"><span class="sub-text">&</span>r</div>
            <div class="key"><span class="sub-text">.</span>t</div>
            <div class="key"><span class="sub-text">*</span>y</div>
            <div class="key"><span class="sub-text">-</span>u</div>
            <div class="key"><span class="sub-text">+</span>i</div>
            <div class="key"><span class="sub-text">&lt;</span>o</div>
            <div class="key"><span class="sub-text">&gt;</span>p</div>
        </div>

        <!-- 2번째 문자 줄: a s d f g h j k l -->
        <div class="row">
            <div class="key"><span class="sub-text">@</span>a</div>
            <div class="key"><span class="sub-text">#</span>s</div>
            <div class="key"><span class="sub-text">:</span>d</div>
            <div class="key"><span class="sub-text">;</span>f</div>
            <div class="key"><span class="sub-text">^</span>g</div>
            <div class="key"><span class="sub-text">♡</span>h</div>
            <div class="key"><span class="sub-text">/</span>j</div>
            <div class="key"><span class="sub-text">(</span>k</div>
            <div class="key"><span class="sub-text">)</span>l</div>
        </div>

        <!-- 3번째 문자 줄: Shift, z x c v b n m, Backspace -->
        <div class="row">
            <div class="key special">⇧</div>
            <div class="key"><span class="sub-text">'</span>z</div>
            <div class="key"><span class="sub-text">"</span>x</div>
            <div class="key"><span class="sub-text">~</span>c</div>
            <div class="key"><span class="sub-text">`</span>v</div>
            <div class="key"><span class="sub-text">'</span>b</div>
            <div class="key"><span class="sub-text">!</span>n</div>
            <div class="key"><span class="sub-text">?</span>m</div>
            <div class="key special">⌫</div>
        </div>

        <!-- 하단 기능 줄 -->
        <div class="row">
            <div class="key special">!?#</div>
            <div class="key special">🌐</div>
            <div class="key space">space</div>
            <div class="key special">.</div>
            <div class="key special">🔍</div>
        </div>
    </div>

</body>
</html>
