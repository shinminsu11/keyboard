<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쓸기자판 뼈대 v7.1.3</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        /* 자판 전체 프레임 (4열 그리드, 우측 열은 세로 쪼개기 비율 적용) */
        .keyboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 0.8fr;
            grid-template-rows: repeat(4, 58px);
            gap: 4px;
            background-color: #000;
            padding: 6px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
        }
        .key {
            background-color: #383838;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            color: #e0e0e0;
            position: relative;
        }

        /* 우측 세로 쪼개기 구역 설정 */
        /* 1행 우측: 설정판 (위쪽 반쪽) */
        .r-top-gear {
            grid-column: 4;
            grid-row: 1;
            background-color: #2b2b2b;
            font-size: 20px;
        }
        /* 2행 우측: 빈 공간 또는 확장 판 */
        .r-mid-1 {
            grid-column: 4;
            grid-row: 2;
            background-color: #2b2b2b;
            font-size: 14px;
        }
        /* 3행 우측: 기호판 (세로 반쪽 쪼개기 및 텍스트 정렬) */
        .r-symbol-half {
            grid-column: 4;
            grid-row: 3;
            background-color: #2b2b2b;
            font-size: 10px;
            line-height: 1.1;
            text-align: center;
        }
        /* 4행 우측: 엔터 및 A 전환 판 (아래쪽 세로 반쪽 쪼개기) */
        .r-enter-half {
            grid-column: 4;
            grid-row: 4;
            background-color: #222;
            font-size: 20px;
        }

        /* 본체 키 스타일 */
        .key.red { color: #ff4444; font-weight: bold; font-size: 20px; }
        .key.yellow { color: #ffeb3b; font-weight: bold; font-size: 20px; }
        .key.green { color: #4caf50; font-weight: bold; font-size: 20px; }
        .key.black-box { border: 2px solid #000; background-color: #333; }
        .mini-num { position: absolute; top: 2px; right: 4px; font-size: 9px; color: #777; }
    </style>
</head>
<body>

    <div class="keyboard-grid">
        <!-- 1행 -->
        <div class="key red">O<span class="mini-num">1</span></div>
        <div class="key">ㄱ<span class="mini-num">2</span></div>
        <div class="key">┃<span class="mini-num">3</span></div>
        <div class="key r-top-gear">⚙</div>

        <!-- 2행 -->
        <div class="key yellow">ㄴ<span class="mini-num">4</span></div>
        <div class="key">ㄷ<span class="mini-num">5</span></div>
        <div class="key">⸩<span class="mini-num">6</span></div>
        <div class="key r-mid-1">⌫</div>

        <!-- 3행 -->
        <div class="key green">ㅅ<span class="mini-num">7</span></div>
        <div class="key">ㅈ<span class="mini-num">8</span></div>
        <div class="key">ㅡ<span class="mini-num">9</span></div>
        <div class="key r-symbol-half">~^'<br>,.?<br>/!A</div>

        <!-- 4행 -->
        <div class="key black-box">□<span class="mini-num">*</span></div>
        <div class="key">ㅂ<span class="mini-num">0</span></div>
        <div class="key">📋<span class="mini-num">#</span></div>
        <div class="key r-enter-half">↵</div>
    </div>

</body>
</html>
